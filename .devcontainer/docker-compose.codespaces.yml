# Codespaces overlay for docker-compose.yml.
#
# start.sh lists this file in COMPOSE_FILE (in .env) when it runs inside a
# codespace, so a plain `docker compose ...` from the repository root picks it
# up as well. Paths are relative to the repository root.

services:
  backend:
    volumes:
      # Raises Octane's 30-second request limit, which stopped example-company
      # installs partway. The entrypoint rebuilds the config cache on every
      # container start, so no image rebuild is needed. See octane.php.
      - ./.devcontainer/octane.php:/var/www/html/config/octane.php:ro

  caddy:
    volumes:
      # Same mount target as the base file, so this replaces the stock Caddyfile.
      - ./.devcontainer/Caddyfile.codespaces:/etc/caddy/Caddyfile:ro
